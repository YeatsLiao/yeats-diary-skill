name: yeats-diary
description: |
  生成 Yeats_Liao "夜知日记" 风格的跑步笔记。
  
  特点：
  - 程序员/技术人视角解读跑步书籍
  - 自然口语化，少引号少emoji，避免AI味
  - 将跑步感悟迁移到代码/工作/生活观察
  - 适合夜跑人群，晚9-11点发布

  使用方法：
  1. 提供书名 + 核心观点
  2. 生成笔记正文 + 多版本标题
  3. 输出可直接发布的markdown

examples:
  - user: "生成《当我谈跑步时我谈些什么》的笔记"
    assistant: "使用 yeats-diary 生成完整笔记"

  - user: "《天生就会跑》怎么写"
    assistant: "调用skill生成技术人视角的读后感"

tags:
  - running
  - content-creation
  - book-notes
  - tech-perspective
